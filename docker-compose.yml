# Full-stack Bike Connect:  nginx (SPA + proxy) → server (API) → postgres
#
#   docker compose up --build      # build images and run the whole stack
#   open http://localhost:8080
#
# The defaults below let the stack boot out-of-the-box for local evaluation.
# For real use, override the secrets via a root .env (compose substitutes the
# ${VARS} below):
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — required for Google sign-in
#   JWT_SECRET                              — set a strong 32+ char secret
#                                             (the built-in default is INSECURE)
#
# The postgres service is unchanged from the original dev setup, so
# `docker compose up postgres` still backs a host-side `npm run dev`.

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: postgresql://bike_connect:bike_connect_dev@postgres:5432/bike_connect
  JWT_SECRET: ${JWT_SECRET:-insecure-dev-only-secret-change-me-0123456789abcdef}
  JWT_EXPIRY: ${JWT_EXPIRY:-7d}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-placeholder}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-placeholder}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
  IMAGE_STORAGE: ${IMAGE_STORAGE:-local}
  LOCAL_UPLOAD_DIR: /app/uploads
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}

x-server-build: &server-build
  context: .
  dockerfile: server/Dockerfile

services:
  postgres:
    image: postgres:16
    container_name: bike-connect-db
    environment:
      POSTGRES_DB: bike_connect
      POSTGRES_USER: bike_connect
      POSTGRES_PASSWORD: bike_connect_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike_connect -d bike_connect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # One-shot: apply migrations once Postgres is healthy, then exit. The server
  # waits for this to complete successfully before starting.
  migrate:
    build: *server-build
    image: bike-connect-server:local
    command: ["node", "server/dist/db/migrate.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build: *server-build
    image: bike-connect-server:local
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: bike-connect-client:local
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  pgdata:
  uploads:
