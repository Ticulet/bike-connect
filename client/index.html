<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2F5233" />
    <title>Bike Connect</title>
    <!-- Fonts are self-hosted: see client/src/styles/fonts.css (@font-face -> /fonts/*.woff2) -->
    <!-- Apply the saved (or system) colour theme before first paint so there is
         no flash of the wrong theme. Mirrors resolveInitialTheme() in
         src/lib/theme.ts — keep the storage key ('bike-connect:theme') in sync. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bike-connect:theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            stored === 'dark' || (stored !== 'light' && prefersDark)
              ? 'dark'
              : 'light';
        } catch (e) {
          /* localStorage / matchMedia unavailable — fall back to light (CSS default) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
